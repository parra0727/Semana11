<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2 Flex:Direction</title>
</head>
<style>
  .contenedor-direction {
    display: flex;
    flex-direction: column; 
    justify-content: center;
    align-items: center;
    background-color: rgb(56, 53, 53);
    height: 100vh; 
  }
  .item {
    background-color: red;
    color: white;
    padding: 20px;
    margin: 10px;
    text-align: center;
  }
</style>
<body>
  <div class="contenedor-direction">
    <div class="item">Objeto 1</div>
    <div class="item">Objeto 2</div>
    <div class="item">Objeto 3</div>
  </div>  
</body>
</html>
