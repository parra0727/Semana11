<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1- Display:Flex</title>
</head>
<style>
  .contenedor-basico {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: rgb(56, 53, 53);
    padding: 20px;
  }
  .item {
    background-color: red;
    color: white;
    padding: 20px;
    margin: 10px;
    text-align: center;
  }
</style>
<body>
  <div class="contenedor-basico">
    <div class="item">Objeto 1</div>
    <div class="item">Objeto 2</div>
    <div class="item">Objeto 3</div>
  </div>
</body>
</html>
